<div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
  <mat-icon class="warning-color">{{data.matIconName}}</mat-icon>
  <span>{{data.message}}</span>
  <div fxFlex></div>
  @if (data.closable) {
    <button mat-icon-button matSnackBarAction (click)="onDismiss()">
      <mat-icon>close</mat-icon>
    </button>
  }
</div>
