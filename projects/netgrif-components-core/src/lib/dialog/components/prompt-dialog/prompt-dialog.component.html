<h2 mat-dialog-title>{{data.title}}</h2>

<div mat-dialog-content>
    <p class="supporting-text">{{data.content}}</p>
    <mat-form-field class="dialog-prompt-field" appearance="outline">
        <mat-label>{{data.placeholder}}</mat-label>
        <input matInput [(ngModel)]="prompt" (ngModelChange)="disableButton = !prompt || prompt.trim().length === 0">
    </mat-form-field>
</div>

<mat-dialog-actions align="end">
    <button mat-button (click)="onClose(false)">{{ 'dialog.close' | translate}}</button>
    <button mat-flat-button [disabled]="disableButton" (click)="onClose(true)">{{ 'dialog.submit' | translate}}</button>
</mat-dialog-actions>
