<h2 mat-dialog-title>{{data.title}}</h2>

<div mat-dialog-content [innerHTML]="parsedContent"></div>

<mat-dialog-actions align="end">
    <button mat-button (click)="onClose(false)">{{data.negativeLabel}}</button>
    <button mat-flat-button (click)="onClose(true)">{{data.positiveLabel}}</button>
</mat-dialog-actions>
