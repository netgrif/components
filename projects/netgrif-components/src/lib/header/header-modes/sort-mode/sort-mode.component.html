<div fxFlex fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="16px" matSort (matSortChange)="sortHeaderChanged($event)">
    @if (approval && typeApproval === 'multichoice') {
    <mat-checkbox [formControl]="approvalFormControl" [indeterminate]="indeterminate" (click)="$event.stopPropagation()"></mat-checkbox>
    }
    @if (approval && typeApproval === 'enumeration') {
    <button mat-icon-button (click)="setValue(); $event.stopPropagation()"><mat-icon>close</mat-icon></button>
    }
    @for (header of headerService.headerState.selectedHeaders$ | async; track header; let i = $index) {
    <div fxFlex class="table-column"
         [fxHide.lt-xl]="i >= 4 && headerService.responsiveHeaders && !headerService.overflowMode"
         [fxHide.lt-lg]="i >= 3 && headerService.responsiveHeaders && !headerService.overflowMode"
         [fxHide.lt-md]="i >= 2 && headerService.responsiveHeaders && !headerService.overflowMode"
         [fxHide.lt-sm]="i >= 1 && headerService.responsiveHeaders && !headerService.overflowMode">
        @if (!!header) {
        <span mat-sort-header="{{ i }}-{{ header.uniqueId }}">{{ header.title | translate }}</span>
        }
    </div>
    }
</div>
