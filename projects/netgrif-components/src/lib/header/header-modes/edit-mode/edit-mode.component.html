<div fxLayout="row" fxFlex="100" fxLayoutAlign="start center"
     class="netgrif-input netgrif-header-input netgrif-input-fix netgrif-zero-field-wrapper">
    <mat-checkbox *ngIf="approval && typeApproval === 'multichoice'" [formControl]="approvalFormControl"
                  [indeterminate]="indeterminate"
                  (click)="$event.stopPropagation();" color='primary' class="checkbox-padding"></mat-checkbox>
    <mat-icon *ngIf="approval && typeApproval === 'enumeration'" color="warn"
              (click)="setValue();$event.stopPropagation();" class="checkbox-padding cursor-fix">close
    </mat-icon>
    <span fxLayout="row" fxLayoutAlign="start center" fxFlex *ngFor="let header of this.headerService.selectedHeaders$ | async; let i = index" class="header-field-icon-container"
          [fxHide.lt-xl]="i >= 4 && this.headerService.responsiveHeaders && !this.headerService.overflowMode"
          [fxHide.lt-lg]="i >= 3 && this.headerService.responsiveHeaders && !this.headerService.overflowMode"
          [fxHide.lt-md]="i >= 2 && this.headerService.responsiveHeaders && !this.headerService.overflowMode"
          [fxHide.lt-sm]="i >= 1 && this.headerService.responsiveHeaders && !this.headerService.overflowMode">
        <mat-form-field fxLayout="row" fxLayoutAlign="center" [ngStyle]="{'min-width': getMinWidth()}"
                        appearance="outline">
            <mat-label *ngIf="!header">{{ 'headers.newHeader' | translate }}</mat-label>
            <input type="text"
                   aria-label="Autocomplete"
                   matInput
                   [formControl]="formControls[i]"
                   [matAutocomplete]="auto">
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete" [displayWith]="renderSelection"
                              (optionSelected)="headerColumnSelected(i, $event.option.value)" fxFlex>
                <mat-optgroup *ngFor="let group of this.filterOptions[i] | async" [label]="group.groupTitle">
                    <mat-option *ngFor="let field of group.fields" [value]="field">
                        {{ field.title | translate }}
                    </mat-option>
                </mat-optgroup>
            </mat-autocomplete>
        </mat-form-field>
        <span *ngIf="header">
            <mat-icon class="icon-padding-fixed cursor-pointer"
                      (click)="sortingHeaderSelected(header)"
                      [ngClass]="{
                          'active': header.sortDirection
                      }">
                {{ header.sortDirection === 'asc' ? 'arrow_upward' : (header.sortDirection === 'desc' ? 'arrow_downward' : 'swap_vert') }}
            </mat-icon><sub *ngIf="sortingPriority(header) as priority" class="sort-priority">{{ priority }}</sub>
        </span>
    </span>
</div>
