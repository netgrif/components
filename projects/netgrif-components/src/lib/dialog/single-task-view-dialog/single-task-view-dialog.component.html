<ng-container *nccLet="(task$ | async) as taskPanelData">
    <h2 mat-dialog-title>{{ !!taskPanelData?.task?.title ? taskPanelData?.task?.title : taskPanelData?.task?.transitionId }}</h2>
</ng-container>
<mat-dialog-content>
    <nc-header [hidden]="true" #header type="task"></nc-header>
    <nc-single-task [task$]="task$"
                    [loading$]="loading$"
                    [selectedHeaders$]="selectedHeaders$"
                    [actionRowJustifyContent]="'center'"
                    [preventCollapse]="preventCollapse"
                    [showPageHeader]="false"
                    [showPageFooter]="false"
                    (taskEvent)="processTaskEvents($event)"></nc-single-task>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{ "dialog.close" | translate }}</button>
</mat-dialog-actions>
