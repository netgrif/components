<h2 mat-dialog-title>{{ "side-menu.user.assign" | translate }}</h2>
<mat-dialog-content class="dialog-column">
    <mat-form-field class="search-field user-search-field" subscriptSizing="dynamic">
        <mat-icon matIconPrefix>search</mat-icon>
        <input matInput placeholder="{{ 'side-menu.user.choose' | translate }}" [formControl]="searchUserControl"/>
        @if (searchUserControl.value) {
        <button mat-icon-button matIconSuffix type="button" (click)="searchUserControl.setValue('')">
            <mat-icon>close</mat-icon>
        </button>
        }
    </mat-form-field>
    <nc-user-assign-list [searchUserControl]="searchUserControl" [roles]="roles" [negativeRoles]="negativeRoles" [initiallySelectedUser]="initiallySelectedUser" (userSelected)="userWasSelected($event)"></nc-user-assign-list>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{ "dialog.close" | translate }}</button>
    <button mat-flat-button (click)="assign()">{{ "tasks.view.assign" | translate }}</button>
</mat-dialog-actions>
