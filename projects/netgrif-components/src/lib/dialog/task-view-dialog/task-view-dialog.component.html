<mat-dialog-content>
    <nc-task-list-pagination
                             [allowMultiOpen]="false"
                             [tasks$]="tasks$"
                             [loading$]="loading$"
                             [textEllipsis]="true"
                             [forceLoadDataOnOpen]="true"
                             [responsiveBody]="true"
                             [selectedHeaders$]="selectedHeaders$"
                             (taskEvent)="processTaskEvents($event)">
        <nc-header #header ncListHeader type="task" [responsiveHeaders]="true"></nc-header>
    </nc-task-list-pagination>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{ "dialog.close" | translate }}</button>
</mat-dialog-actions>
