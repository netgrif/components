<div fxLayout="column">
    <div class="task-panel-body" fxFlex="100">
        <nc-task-content
            [noDataText]="taskContentText$ | async"
        ></nc-task-content>

        @if (!processingTaskChange && displayTaskControlButtons) {
        <div fxLayoutAlign="center center">
            @if (canAssign()) {
            <button color="primary" (click)="assign()" mat-raised-button>
                {{ getAssignTitle() | translate }}
            </button>
            } @if (canCancel()) {
            <button color="warn" (click)="cancel()" mat-stroked-button>
                {{ getCancelTitle() | translate }}
            </button>
            } @if (canFinish()) {
            <button color="primary" (click)="finish()" mat-raised-button>
                {{ getFinishTitle() | translate }}
            </button>
            }
        </div>
        } @if (processingTaskChange) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }
    </div>
</div>
