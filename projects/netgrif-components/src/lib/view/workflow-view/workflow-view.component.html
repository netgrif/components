<div class="view">
    <div class="search-row">
        <div class="search">
            <label class="search-bar">
                <mat-icon>search</mat-icon>
                <input type="text"
                       [formControl]="fullTextFormControl"
                       [placeholder]="'search.fullText' | translate"
                       [attr.aria-label]="'search.fullText' | translate"
                       (keydown.enter)="$any($event.target).blur()">
                @if (fullTextFormControl.value) {
                <button mat-icon-button type="button" (click)="fullTextFormControl.setValue('')">
                    <mat-icon>close</mat-icon>
                </button>
                }
            </label>
        </div>
        <button mat-fab extended (click)="importNet()">
            <mat-icon>upload_file</mat-icon>
            {{ "side-menu.import-net.upload" | translate }}
        </button>
    </div>

    <div class="list">
        <nc-header #header [type]="headerType"></nc-header>
        @if (workflows$ | async; as workflows) {
        @if ((loading$ | async) === false && workflows.length === 0) {
        <div class="nae-empty-state" role="status">
            <mat-icon class="nae-empty-state-icon">account_tree</mat-icon>
            <span class="nae-empty-state-title">{{ "view-list.noProcessesSatisfyingThisFilter" | translate }}</span>
            <span class="nae-empty-state-text">{{ "view-list.noProcessesHint" | translate }}</span>
        </div>
        }
        <mat-accordion multi="true" class="accordion">
            <cdk-virtual-scroll-viewport itemSize="50" (scrolledIndexChange)="loadNextPage()" class="viewport">
                <nc-workflow-panel
                    *cdkVirtualFor="let workflow of workflows; let first = first; let last = last; templateCacheSize: 0; trackBy: trackBy"
                    [workflow]="workflow"
                    [first]="first"
                    [last]="last"
                    [selectedHeaders$]="selectedHeaders$"
                    [showDeleteMenu]="showDeleteMenu"
                ></nc-workflow-panel>
                @if (loading$ | async) {
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
                }
            </cdk-virtual-scroll-viewport>
        </mat-accordion>
        }
    </div>
</div>
