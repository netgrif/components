@if (shouldShowCreateButton() | async) {
@let loading = loading$ | async;
<button mat-fab extended class="create-case" (click)="createNewCase()" [disabled]="loading || disabled" [attr.aria-busy]="loading">
    <mat-icon>{{ resolvedCaseButtonIcon || "add" }}</mat-icon>
    {{ resolvedCaseButtonTitle || ("side-menu.new-case.case" | translate) }}
    @if (loading) {
    <mat-progress-bar class="create-case-progress" mode="indeterminate"></mat-progress-bar>
    }
</button>
}
