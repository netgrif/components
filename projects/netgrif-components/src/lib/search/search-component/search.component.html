@if (advancedSearchDisplayed) {
<div class="filter-bar" [class.disabled]="disabled">
    <mat-icon class="filter-bar-icon">filter_list</mat-icon>
    <nc-advanced-search class="filter-bar-conditions" [editable]="!disabled"></nc-advanced-search>
    <div class="filter-bar-actions">
        <ng-container *ngTemplateOutlet="toggleButton"></ng-container>
        @if (showAdvancedSearchHelp) {
        <button mat-icon-button [matMenuTriggerFor]="menu" [attr.aria-label]="'search.tooltip.help' | translate" [disabled]="disabled">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu" xPosition="before">
            <button mat-menu-item (click)="showHelp()">
                <mat-icon>help</mat-icon>
                <span>{{ "search.tooltip.help" | translate }}</span>
            </button>
        </mat-menu>
        }
    </div>
</div>
} @else {
<nc-fulltext-search [disabled]="disabled">
    <ng-container *ngTemplateOutlet="toggleButton"></ng-container>
</nc-fulltext-search>
}

<ng-template #toggleButton>
    @if (showSearchToggleButton) {
    <button mat-icon-button type="button"
            [disabled]="disabled"
            [matTooltip]="(advancedSearchDisplayed ? 'search.tooltip.toFullText' : 'search.tooltip.toAdvanced') | translate"
            (click)="toggleSearchMode()">
        <mat-icon>{{ advancedSearchDisplayed ? "search" : "filter_list" }}</mat-icon>
    </button>
    }
</ng-template>
