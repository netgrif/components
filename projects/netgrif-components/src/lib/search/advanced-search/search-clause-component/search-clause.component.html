<div class="clause">
    @for (item of getPredicateMap() | keyvalue; track trackByPredicates($index, item)) {
    <nc-search-predicate [predicate]="item.value.wrappedPredicate"
                         [predicateId]="item.key"
                         [remove$]="removeChild$"
                         [generator]="item.value.generator"
                         [editable]="editable"></nc-search-predicate>
    }
</div>
