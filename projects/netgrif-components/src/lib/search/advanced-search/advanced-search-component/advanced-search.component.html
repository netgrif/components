<div class="conditions">
    @for (item of getPredicateMap() | keyvalue; track trackByPredicates($index, item); let first = $first) {
    @if (!first) {
    <span class="joiner">{{ "search.and" | translate }}</span>
    }
    <nc-search-clause [predicate]="item.value"
                      [predicateId]="item.key"
                      [remove$]="removeChild$"
                      [editable]="editable"></nc-search-clause>
    }
    @if (editable) {
    <button mat-button class="add-condition" (click)="addChildPredicate()">
        <mat-icon>add</mat-icon>
        {{ "search.addCondition" | translate }}
    </button>
    }
</div>
