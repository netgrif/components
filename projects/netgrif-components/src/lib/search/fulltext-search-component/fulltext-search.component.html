<label class="search-bar" [class.disabled]="fullTextFormControl.disabled">
    <mat-icon>search</mat-icon>
    <input type="text"
           [formControl]="fullTextFormControl"
           [placeholder]="'search.fullText' | translate"
           [attr.aria-label]="'search.fullText' | translate"
           (keydown.enter)="$event.target.blur()">
    @if (fullTextFormControl.value && fullTextFormControl.enabled) {
    <button mat-icon-button type="button" (click)="fullTextFormControl.setValue('')">
        <mat-icon>close</mat-icon>
    </button>
    }
    <ng-content></ng-content>
</label>
