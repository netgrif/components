<button mat-icon-button [matMenuTriggerFor]="languageMenu">
    <mat-icon class="flag-icon" [innerHTML]="getLangIcon(getCurrentLang())"></mat-icon>
</button>

<mat-menu #languageMenu="matMenu">
    @for (lang of getLangKeys(); track lang) {
    <button mat-menu-item (click)="setLang(lang)" [disabled]="lang === getCurrentLang()">
        <mat-icon class="flag-icon" [innerHTML]="getLangIcon(lang)"></mat-icon>
        <span>{{ "toolbar.menu." + lang | translate }}</span>
    </button>
    }
</mat-menu>
