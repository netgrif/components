<mat-sidenav-container
    class="drawer-container"
    (panright)="swipeRight()"
    (panleft)="swipeLeft()"
    autosize
>
    <mat-sidenav
        #sidenav
        [mode]="config.mode"
        [(opened)]="opened"
        position="start"
        [disableClose]="config.disableClose"
        class="drawer-content"
        mwlResizable
        [style.width.px]="width"
        (resizing)="onResizeEvent($event)"
    >
        <div class="sidenav-wrapper">
            @if (!fixed) {
            <button
                class="sidenav-close-button"
                type="button"
                aria-label="Toggle sidenav"
                mat-icon-button
                (click)="close()"
            >
                <mat-icon aria-label="Side nav toggle icon">close</mat-icon>
            </button>
            }
            <div fxLayout="column" fxLayoutAlign="start center" fxFlex>
                @if (showUser) {
                <nc-user-card
                    [user]="user"
                    mode="full"
                    [contentWidth]="contentWidth"
                ></nc-user-card>
                } @if (showUser) {
                <mat-divider class="drawer-divider"></mat-divider>
                } @if (showQuickPanel) {
                <nc-quick-panel
                    [items]="quickPanelItems"
                    [contentWidth]="contentWidth"
                ></nc-quick-panel>
                } @if (showQuickPanel) {
                <mat-divider class="drawer-divider"></mat-divider>
                } @if (navigation) {
                <nc-navigation-tree
                    [contentWidth]="contentWidth"
                ></nc-navigation-tree>
                }
            </div>
        </div>
    </mat-sidenav>

    <mat-sidenav-content>
        <div
            class="content-wrapper"
            fxLayout="row"
            fxLayoutAlign="space-between none"
        >
            @if (!sidenav.opened) {
            <button
                type="button"
                aria-label="Toggle sidenav"
                mat-icon-button
                (click)="open()"
            >
                <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
            </button>
            }
            <div fxFlex="100">
                <ng-content></ng-content>
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
