@if (initialized) {
<ng-template [cdkPortalOutlet]="portal"></ng-template>
} @else if (errored) {
<div class="nae-empty-state" role="alert">
    <mat-icon class="nae-empty-state-icon">error_outline</mat-icon>
    <span class="nae-empty-state-title">{{ "dynamicNavigation.couldNotResolveView" | translate }}</span>
</div>
} @else {
<mat-progress-bar mode="indeterminate"></mat-progress-bar>
}
