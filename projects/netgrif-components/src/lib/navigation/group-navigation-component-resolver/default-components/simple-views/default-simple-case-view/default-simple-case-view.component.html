<div class="view" fxLayout="column" fxLayoutGap="16px">
    <div class="search-row">
        <div class="search">
            @if (enableSearch) {
            <nc-search [showSearchToggleButton]="showToggleButton" [initialSearchMode]="initialSearchMode"></nc-search>
            }
        </div>
        @if (allowExport) {
        <button mat-mini-fab (click)="export()" [disabled]="isLoading()">
            <mat-icon>{{ isLoading() ? "schedule" : "save_alt" }}</mat-icon>
        </button>
        }
        @if (showCreateCaseButton) {
        <nc-create-case-button [newCaseCreationConfig]="newCaseCreationConfig"
                               (caseCreatedEvent)="handleCaseClick($event)"></nc-create-case-button>
        }
    </div>

    <nc-case-list-paginator class="list" fxFlex
                            [selectedHeaders$]="selectedHeaders$"
                            [showDeleteMenu]="showDeleteMenu"
                            [width]="getWidth()"
                            [responsiveBody]="true"
                            [textEllipsis]="true"
                            [emptyContentText]="emptyContentText"
                            [emptyContentIcon]="emptyContentIcon">
        <nc-header #header ncListHeader
                   [type]="headerType"
                   [responsiveHeaders]="true"
                   [ngStyle]="{ width: getWidth() }"
                   [hideHeaderMenu]="!headersChangeable"
                   [showEditButton]="isMenuOptionEnabled('edit')"
                   [showSortButton]="isMenuOptionEnabled('sort')"
                   [showSearchButton]="isMenuOptionEnabled('search')"
                   [showTableSection]="allowTableMode"></nc-header>
    </nc-case-list-paginator>
</div>
