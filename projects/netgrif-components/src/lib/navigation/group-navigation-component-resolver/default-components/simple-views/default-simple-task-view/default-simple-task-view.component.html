<div class="view" fxLayout="column" fxLayoutGap="16px">
    @if (searchEnabled) {
    <nc-search [showSearchToggleButton]="showToggleButton" [initialSearchMode]="initialSearchMode"></nc-search>
    }
    <div fxFlex fxLayout="column">
        <nc-header #header
                   type="task"
                   [hideHeaderMenu]="!headersChangeable"
                   [showEditButton]="isMenuOptionEnabled('edit')"
                   [showSortButton]="isMenuOptionEnabled('sort')"
                   [showTableSection]="allowTableMode"></nc-header>
        <nc-task-list fxFlex
                      [tasks$]="tasks$"
                      [loading$]="loading$"
                      [allowMultiOpen]="false"
                      [selectedHeaders$]="selectedHeaders$"
                      [textEllipsis]="true"
                      [showMoreMenu]="showMoreMenu"
                      [emptyContentText]="emptyContentText"
                      [emptyContentIcon]="emptyContentIcon"></nc-task-list>
    </div>
</div>
