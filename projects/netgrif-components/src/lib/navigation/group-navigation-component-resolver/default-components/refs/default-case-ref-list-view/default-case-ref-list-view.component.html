<div fxLayout="column" fxLayoutGap="16px">
    <div class="search-row">
        <div class="search">
            @if (search) {
            <nc-search [disabled]="disabled()"></nc-search>
            }
        </div>
        @if (createCase) {
        <nc-create-case-button [disabled]="disabled()"
                               [newCaseCreationConfig]="newCaseCreationConfig"
                               (caseCreatedEvent)="createdCase($event)"></nc-create-case-button>
        }
    </div>
    <nc-case-list-paginator [selectedHeaders$]="selectedHeaders$"
                            [showDeleteMenu]="false"
                            [width]="getWidth()"
                            [approval]="isApproval()"
                            [disabled]="disabled()"
                            [responsiveBody]="true"
                            [textEllipsis]="true"
                            (caseClick)="handleCaseClick($event)">
        <nc-header #header ncListHeader [type]="headerType" [responsiveHeaders]="true" [ngStyle]="{ width: getWidth() }" [approval]="isApproval()"></nc-header>
    </nc-case-list-paginator>
</div>
