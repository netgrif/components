<div fxLayout="column">
    <nc-task-list-pagination [allowMultiOpen]="false"
                             [tasks$]="tasks$"
                             [loading$]="loading$"
                             [textEllipsis]="true"
                             [forceLoadDataOnOpen]="true"
                             [responsiveBody]="true"
                             [selectedHeaders$]="selectedHeaders$"
                             (taskEvent)="logEvent($event)">
        <nc-header #header ncListHeader type="task" [responsiveHeaders]="true"></nc-header>
    </nc-task-list-pagination>
</div>
