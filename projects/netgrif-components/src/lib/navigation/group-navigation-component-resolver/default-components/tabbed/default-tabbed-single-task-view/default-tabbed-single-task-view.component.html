<div class="view">
    <nc-single-task [task$]="task$"
                    [loading$]="loading$"
                    [selectedHeaders$]="selectedHeaders$"
                    [actionRowJustifyContent]="actionRowJustifyContent"
                    [hideActionRow]="hideActionRow"
                    [hidePanelHeader]="hidePanelHeader"
                    [showPageHeader]="showPageHeader"
                    [showPageFooter]="showPageFooter"
                    [actionButtonTemplates]="[closeButton, finishButton]"></nc-single-task>
</div>

<ng-template #closeButton>
    @if (showCloseButton) {
    <button mat-button (click)="closeTab()">{{ "tasks.view.closeTab" | translate }}</button>
    }
</ng-template>

<ng-template #finishButton let-finish="finish">
    @if (showFinishButton) {
    <button mat-flat-button (click)="finish()">{{ getFinishTitle() | translate }}</button>
    }
</ng-template>
