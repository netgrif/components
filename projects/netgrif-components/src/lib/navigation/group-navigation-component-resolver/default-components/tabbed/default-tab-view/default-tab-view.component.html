<div fxLayout="column" fxFill>
    <nc-tab-view #tabView fxFlex [initialTabs]="tabs" [hideHeader]="true" stretch="false"></nc-tab-view>

    @let selected = tabView.tabView?.selectedIndex.value ?? 0;
    @if (selected > 0) {
    <div class="detail-header" fxFlexOrder="-1" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="4px">
        <button mat-icon-button (click)="closeDetail(tabView.tabView)" [matTooltip]="'toolbar.menu.back' | translate">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="mat-title-large detail-title">{{ tabView.tabView.openedTabs[selected]?.getText$() | async | translate }}</h1>
    </div>
    }
</div>
