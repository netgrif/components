<div class="view" fxLayout="column" fxLayoutAlign="start center" fxLayoutGap="16px">
    @if ((loading$ | async) || isCardLoading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    @if (!isCardLoading()) {
    <mat-form-field>
        <mat-label>Search</mat-label>
        <mat-icon matIconSuffix>search</mat-icon>
        <input matInput type="search" [formControl]="search"/>
    </mat-form-field>
    <div fxLayout="row wrap" fxLayoutAlign="center center" fxLayoutGap="16px grid">
        @for (item of filteredDashboardItems; track item) {
        <div>
            <button mat-stroked-button (click)="createCase(item)">
                <mat-icon>{{ item.icon }}</mat-icon>
                {{ item.title }}
            </button>
        </div>
        }
    </div>
    }
</div>
