<mat-sidenav-container>
    <mat-sidenav
        #sideRail
        mode="side"
        opened="true"
        position="start"
        disableClose="true"
        (mouseenter)="expandOnHover && open()"
        (mouseleave)="expandOnHover && close()"
    >
        <div class="rail" [class.rail-expanded]="expanded">
            <div fxLayout="column" fxLayoutAlign="start start" fxFlex>
                <div fxLayout="row">
                    <mat-icon>account_circle</mat-icon>
                    @if (expanded) {
                    <span class="margin-left-default">User</span>
                    }
                </div>
                <div fxLayout="row">
                    <mat-icon>assignment</mat-icon>
                    @if (expanded) {
                    <span class="margin-left-default">Report</span>
                    }
                </div>
                <div fxLayout="row">
                    <mat-icon>bug_report</mat-icon>
                    @if (expanded) {
                    <span class="margin-left-default">Bugs</span>
                    }
                </div>
                <div fxLayout="row">
                    <mat-icon>fingerprint</mat-icon>
                    @if (expanded) {
                    <span class="margin-left-default">Security</span>
                    }
                </div>
            </div>
        </div>
    </mat-sidenav>

    <mat-sidenav-content class="rail-content" [class.rail-content-expanded]="expanded">
        <ng-content></ng-content>
    </mat-sidenav-content>
</mat-sidenav-container>
