<gridster (click)="deselect()" [options]="options">
    @for (field of placedDataFields; track field) {
    <gridster-item
        [item]="field"
        (itemInit)="onItemInit(field)"
        [ngClass]="{ 'active-item-gridster': isActive(field) }"
        class="gridster-item"
    >
        <form
            (click)="select($event, field)"
            (contextmenu)="openMenu($event, field)"
            class="fill-all-space gridster-item-form"
        >
            @if (isInitialized(field)) {
            <nc-builder-gridster-datafield
                [dataField]="field"
                class="fill-all-space"
            ></nc-builder-gridster-datafield>
            }
            <div class="hover-button">
                @if (!_builderModeService.readOnly) {
                <button class="drag-handler" mat-mini-fab>
                    <mat-icon>open_with</mat-icon>
                </button>
                } @if (!_builderModeService.readOnly) {
                <button (mousedown)="removeItem($event, field)" mat-mini-fab>
                    <mat-icon>delete</mat-icon>
                </button>
                }
            </div>
        </form>
    </gridster-item>
    }
</gridster>
