<ng-container *ngIf="selectedTransition">
    <div class="info-label-header">
        <div class="info-label-group">
            <span class="info-label-header-text">Process</span>
        </div>
        <div class="info-label-group">
            <span class="info-label-header-text">Task</span>
        </div>
        <div class="info-label-group">
            <span class="info-label-header-text">ID</span>
        </div>
    </div>
    <div class="info-label-panel">
        <div class="info-label-group">
            <mat-icon *ngIf="model?.icon" class="info-label-icon" aria-label="Process icon">{{ model.icon }}</mat-icon>
            <span class="info-label-title">{{ model?.title?.value }}</span>
        </div>
        <div class="info-label-group">
            <span class="info-label-title">{{ selectedTransition.label?.value }}</span>
        </div>
        <div class="info-label-group">
            <span class="info-label-title">{{ selectedTransition.id }}</span>
        </div>
    </div>
</ng-container>
<div class="info-label-panel" *ngIf="!selectedTransition">
    <span>{{ 'builder.form-builder.info-label.noTransition' | translate }}</span>
    <span fxFlex></span>
    <button (click)="redirect()" aria-label="Close form builder" mat-icon-button>
        <mat-icon>close</mat-icon>
    </button>
</div>
