<h2 mat-dialog-title>{{ 'builder.dialogs.dead-net.title' | translate }}</h2>
<mat-dialog-content class="dialog-column">
    <p class="supporting-text">{{ 'builder.dialogs.dead-net.message' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">{{ 'builder.dialogs.dead-net.cancel' | translate }}</button>
    <button mat-flat-button [mat-dialog-close]="true">{{ 'builder.dialogs.dead-net.download' | translate }}</button>
</mat-dialog-actions>
