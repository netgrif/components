<h2 mat-dialog-title>{{ 'builder.dialogs.dead-net.title' | translate }}</h2>
<mat-dialog-content class="mat-typography padding-top-4px">
    <span>{{ 'builder.dialogs.dead-net.message' | translate }}</span>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">{{ 'builder.dialogs.dead-net.cancel' | translate }}</button>
    <button mat-button [mat-dialog-close]="true">{{ 'builder.dialogs.dead-net.download' | translate }}</button>
</mat-dialog-actions>
