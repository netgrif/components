<h2 mat-dialog-title class="hero-title">
    <mat-icon>warning_amber</mat-icon>
    <span>{{ 'builder.dialogs.delete-model.title' | translate }}</span>
</h2>
<mat-dialog-content class="dialog-column">
    <p class="supporting-text">{{ 'builder.dialogs.delete-model.message' | translate }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">{{ 'builder.dialogs.delete-model.cancel' | translate }}</button>
    <button mat-flat-button [mat-dialog-close]="true" cdkFocusInitial>{{ 'builder.dialogs.delete-model.delete' | translate }}</button>
</mat-dialog-actions>
