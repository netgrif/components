<h2 mat-dialog-title>
    <mat-icon>warning_amber</mat-icon>
    <span>{{ 'builder.dialogs.delete-model.title' | translate }}</span>
</h2>
<mat-dialog-content class="mat-typography padding-top-4px">
    <h3>{{ 'builder.dialogs.delete-model.message' | translate }}</h3>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">{{ 'builder.dialogs.delete-model.cancel' | translate }}</button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial>{{ 'builder.dialogs.delete-model.delete' | translate }}</button>
</mat-dialog-actions>
