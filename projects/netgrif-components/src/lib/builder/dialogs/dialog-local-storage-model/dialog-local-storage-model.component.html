<h2 mat-dialog-title>{{ 'builder.dialogs.local-storage-model.title' | translate }}</h2>
<mat-dialog-content class="dialog-column">
    <p class="supporting-text">{{ 'builder.dialogs.local-storage-model.message' | translate }} "{{data.title}}" [{{data.id}}] {{ 'builder.dialogs.local-storage-model.from' | translate }} {{data.timestamp}}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">
        {{ 'builder.dialogs.local-storage-model.deleteOld' | translate }}
    </button>
    <button mat-flat-button [mat-dialog-close]="true">
        {{ 'builder.dialogs.local-storage-model.load' | translate }}
    </button>
</mat-dialog-actions>
