<div class="view">
    <nc-task-list-pagination class="list"
                             [tasks$]="tasks$"
                             [loading$]="loading$"
                             [allowMultiOpen]="false"
                             [selectedHeaders$]="selectedHeaders$"
                             [textEllipsis]="true"
                             (taskEvent)="onTaskEvent($event)">
        <nc-header #header ncListHeader type="task" [maxHeaderColumns]="3"></nc-header>
    </nc-task-list-pagination>
</div>
