<div class="task-tab-background full-height">
    <div fxLayout="column" fxLayoutAlign="start stretch" class="content-margin full-height" >
        <nc-header #header type="task" [maxHeaderColumns]="3" class="task-panel-padding-mini" ></nc-header>
        <nc-task-list-pagination (taskEvent)="onTaskEvent($event)" [tasks$]="tasks$" [loading$]="loading$" [allowMultiOpen]="false" [selectedHeaders$]="selectedHeaders$" [textEllipsis]="true" fxFlex></nc-task-list-pagination>
    </div>
</div>
