<div class="row">
    <div class="what">
        <span class="name">{{ name }}</span>
        <span class="string-id" [title]="('builder.modeler.i18n-mode.stringId' | translate) + ': ' + field.name">{{ field.name }}</span>
    </div>
    <span class="default" [class.empty]="!field.value" [title]="'builder.modeler.i18n-mode.defaultValue' | translate">{{ field.value || '–' }}</span>
    @if (translationField) {
    <mat-form-field class="translation" subscriptSizing="dynamic">
        <mat-label>{{ "builder.modeler.i18n-mode.translation" | translate }}</mat-label>
        <input matInput [(ngModel)]="translationField.value" (change)="changeTranslation()" [disabled]="_builderModeService.readOnly"/>
    </mat-form-field>
    }
</div>
