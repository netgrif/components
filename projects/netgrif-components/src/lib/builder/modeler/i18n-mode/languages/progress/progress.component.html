<div class="item">
    <button type="button" class="select" (click)="emitSelectLocale()">
        <nc-builder-flag class="flag" [locale]="locale"></nc-builder-flag>
        <span class="name">{{ locale.prettyName }}</span>
        <mat-icon class="chevron">chevron_right</mat-icon>
    </button>
    @if (!_builderModeService.readOnly) {
    <button mat-icon-button type="button" matTooltip="{{ 'builder.modeler.i18n-mode.removeLocale' | translate }}" (click)="removeLocale()">
        <mat-icon>delete</mat-icon>
    </button>
    }
</div>
