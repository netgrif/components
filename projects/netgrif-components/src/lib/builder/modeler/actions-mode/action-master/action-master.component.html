<div fxLayout="column" class="height-fix">
    <div class="height-max" matSort (matSortChange)="sortData($event)">
        <div *ngIf="!isFunctionsModeSelected()" class="height-100">
            <div mat-subheader *ngIf="!isProcessAndCase()" class="header-action">
                <p fxFlex="40" mat-sort-header="id"><strong>ID</strong></p>
                <p fxFlex mat-sort-header="name">{{ 'builder.modeler.actions-mode.action-master.name' | translate }}</p>
            </div>
            <mat-action-list class="height-max" >
                <nc-builder-main-master-item *ngFor="let item of pageData"
                                  [item]="item"
                                  [masterItemComponent]="actionMasterItemComponent"
                                  [masterService]="masterService" ></nc-builder-main-master-item>
            </mat-action-list>
        </div>
        <div *ngIf="isFunctionsModeSelected()" class="height-100">
            <div mat-subheader class="header-action">
                <p fxFlex="40"><strong>{{ 'builder.modeler.actions-mode.action-master.name' | translate }}</strong></p>
                <p fxFlex>{{ 'builder.modeler.actions-mode.action-master.scope' | translate }}</p>
                <button mat-icon-button class="button-line" matTooltip="{{ 'builder.modeler.actions-mode.action-master.addFunction' | translate }}" (click)="create()">
                    <mat-icon>add</mat-icon>
                </button>
            </div>
            <mat-action-list class="height-max" >
                <nc-builder-main-master-item *ngFor="let item of pageData"
                                  [item]="item"
                                  [masterItemComponent]="functionMasterItemComponent"
                                  [masterService]="masterService" ></nc-builder-main-master-item>
            </mat-action-list>
        </div>
    </div>
    <mat-paginator fxFlex class="footer" [length]="totalSize" [pageSize]="pageSize" [pageIndex]="pageIndex"
                   [pageSizeOptions]="pageSizeOptions" (page)="onPageChanged($event)" showFirstLastButtons="false">
    </mat-paginator>
</div>
