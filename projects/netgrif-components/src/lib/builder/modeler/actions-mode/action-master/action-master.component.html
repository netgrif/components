<div class="master">
    <div class="master-toolbar">
        @if (isFunctionsModeSelected() && !_builderModeService.readOnly) {
        <button mat-flat-button (click)="create()">
            <mat-icon>add</mat-icon>
            {{ "builder.modeler.actions-mode.action-master.addFunction" | translate }}
        </button>
        }
        <span class="spacer"></span>
        @if (!isFunctionsModeSelected() && !isProcessAndCase()) {
        <button mat-icon-button [matMenuTriggerFor]="sortMenu" [matTooltip]="'builder.modeler.components.master-detail.sort' | translate">
            <mat-icon>sort</mat-icon>
        </button>
        <mat-menu #sortMenu="matMenu" xPosition="before">
            <button mat-menu-item (click)="sortBy('name')">
                <mat-icon>{{ sortIcon("name") }}</mat-icon>
                <span>{{ "builder.modeler.actions-mode.action-master.name" | translate }}</span>
            </button>
            <button mat-menu-item (click)="sortBy('id')">
                <mat-icon>{{ sortIcon("id") }}</mat-icon>
                <span>ID</span>
            </button>
        </mat-menu>
        }
    </div>
    <mat-action-list class="list">
        @for (item of pageData; track item) {
        <nc-builder-main-master-item
            [item]="item"
            [masterItemComponent]="isFunctionsModeSelected() ? functionMasterItemComponent : actionMasterItemComponent"
            [masterService]="masterService"
        ></nc-builder-main-master-item>
        }
    </mat-action-list>
    <mat-paginator
        [length]="totalSize"
        [pageSize]="pageSize"
        [pageIndex]="pageIndex"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChanged($event)"
        showFirstLastButtons="false"
    >
    </mat-paginator>
</div>
