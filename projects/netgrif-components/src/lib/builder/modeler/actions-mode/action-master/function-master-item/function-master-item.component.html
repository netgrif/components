<mat-list-item class="master-row" [class.item-selected]="selected && selected === item" (click)="select()">
    <span matListItemTitle>{{ item.name }}</span>
    <span matListItemLine class="supporting">{{ item.scope }}</span>
    <span matListItemMeta class="row-actions">
        @if (!_builderModeService.readOnly) {
        <button mat-icon-button [matTooltip]="'builder.modeler.actions-mode.action-master.deleteFunction' | translate" (click)="onDelete($event, item)">
            <mat-icon>delete</mat-icon>
        </button>
        }
    </span>
</mat-list-item>
