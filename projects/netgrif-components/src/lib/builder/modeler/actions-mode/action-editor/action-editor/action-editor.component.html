<div class="description" id="description">
    <nc-builder-action-editor-menu-description
        id="description-content"
        #descriptionComponent
    ></nc-builder-action-editor-menu-description>
</div>
<mat-card appearance="outlined" class="action-card" [class.collapsed]="!expanded" id="{{ action.event + '_' + action.phase + '_' + index }}">
    <div class="action-header">
        <button mat-icon-button type="button" class="expand-button" (click)="toggleExpanded()"
                [attr.aria-expanded]="expanded"
                [matTooltip]="(expanded ? 'builder.modeler.actions-mode.action-editor.action-editor.collapse' : 'builder.modeler.actions-mode.action-editor.action-editor.expand') | translate">
            <mat-icon>{{ expanded ? "expand_less" : "expand_more" }}</mat-icon>
        </button>
        <span class="action-title" (click)="toggleExpanded()">{{
            "builder.modeler.actions-mode.action-editor.action-editor.action" | translate
        }} {{ action.id }}</span>
        @if (!expanded) {
        <code class="action-preview" (click)="toggleExpanded()">{{ preview }}</code>
        }
        <span class="spacer"></span>
        @if (expanded && !_builderModeService.readOnly) {
        <button mat-icon-button type="button" (click)="openDrawer()"
                [class.toggled]="drawer.opened" [attr.aria-pressed]="drawer.opened"
                [matTooltip]="'builder.modeler.actions-mode.action-editor.action-editor.functions' | translate">
            <mat-icon>functions</mat-icon>
        </button>
        }
        <mat-menu #referencesMenu="matMenu">
            @for (configuration of editorConfigurations; track configuration) {
            <nc-builder-action-editor-menu-item
                [parentTrigger]="referencesTrigger"
                [trigger]="referenceItemTrigger"
                #referenceItem="menuInOtherComponent"
                [configuration]="configuration"
                [hidden]="!referencesOpened"
            ></nc-builder-action-editor-menu-item>
            <button mat-menu-item #referenceItemTrigger="matMenuTrigger" [matMenuTriggerFor]="referenceItem.menu">
                {{ configuration.title }}
            </button>
            }
        </mat-menu>
        <button #matButton type="button" mat-button
                #referencesTrigger="matMenuTrigger"
                [matMenuTriggerFor]="referencesMenu"
                [hidden]="_builderModeService.readOnly || !expanded">
            <mat-icon>link</mat-icon>
            {{ "builder.modeler.actions-mode.action-editor.action-editor.references" | translate }}
            <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
        </button>
        @if (!_builderModeService.readOnly) {
        <button mat-icon-button type="button" (click)="openDialog(index)"
                [matTooltip]="'builder.modeler.actions-mode.action-editor.action-editor.delete' | translate">
            <mat-icon>delete</mat-icon>
        </button>
        }
    </div>
    <mat-sidenav-container autosize class="action-body">
        <mat-sidenav mode="side" #drawer>
            <nc-builder-action-editor-menu
                [descriptionComponent]="descriptionComponent"
                [editor]="editor"
            ></nc-builder-action-editor-menu>
        </mat-sidenav>
        <mat-sidenav-content>
            <div fxLayout="column" fxLayoutAlign="start stretch" id="{{ name + '_div' }}">
                <ngx-monaco-editor
                    class="full-size-editor"
                    [style.height.px]="editorHeight"
                    id="{{ name + '_editor' }}"
                    [options]="editorOptions"
                    [formControl]="formControl"
                    (onInit)="onInit($event)"
                ></ngx-monaco-editor>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>
</mat-card>
