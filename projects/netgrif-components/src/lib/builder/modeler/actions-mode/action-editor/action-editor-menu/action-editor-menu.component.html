<mat-accordion #accordion id="accordion" class="list-accordion">
    @for (actions of menuItems; track actions) {
    <mat-expansion-panel
        class="actions-list-expansion-panel"
        #panel
        [disabled]="actions.actions.length === 0"
    >
        <mat-expansion-panel-header>
            <mat-panel-title>
                <span class="menu-span">
                    <mat-icon class="description-info-button">
                        {{ actions.badge }}
                    </mat-icon>
                    <p class="menu-label">{{ actions.label }}</p>
                </span>
            </mat-panel-title>
        </mat-expansion-panel-header>
        <ng-template matExpansionPanelContent>
            <mat-list>
                @for (item of actions.actions; track item) {
                <mat-list-item>
                    <div fxLayout="row" fxFlex fxLayoutAlign="start center">
                        <span
                            class="menu-span-item"
                            matTooltip="{{ item.label }}"
                            (click)="addTextToEditor(item.action)"
                        >
                            {{ item.label }}
                        </span>
                    </div>
                    <div fxLayout="row" fxLayoutAlign="end center">
                        @if (item.description || item.header) {
                        <button
                            mat-icon-button
                            class="description-info-button"
                            (click)="handleClick(item)"
                        >
                            <mat-icon>info</mat-icon>
                        </button>
                        }
                    </div>
                </mat-list-item>
                }
            </mat-list>
        </ng-template>
    </mat-expansion-panel>
    }
</mat-accordion>
