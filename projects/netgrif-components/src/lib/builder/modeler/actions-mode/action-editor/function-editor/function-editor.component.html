<div class="description" id="description">
    <nc-builder-action-editor-menu-description
        id="description-content"
        #descriptionComponent
    ></nc-builder-action-editor-menu-description>
</div>
<mat-sidenav-container autosize>
    <mat-sidenav
        mode="side"
        #drawer
        mwlResizable
        mwlResizeHandle
        [resizeEdges]="{ left: true }"
    >
        <nc-builder-action-editor-menu
            [descriptionComponent]="descriptionComponent"
            [editor]="editor"
        ></nc-builder-action-editor-menu>
    </mat-sidenav>
    <mat-sidenav-content>
        <div fxLayout="row">
            <div fxFlex fxLayoutGap="3em" fxLayoutAlign="start center">
                <button type="button" mat-button (click)="openDrawer()">
                    @if (drawer.opened) {
                    <mat-icon>
                        keyboard_arrow_left
                    </mat-icon>
                    } @else {
                    <mat-icon>
                        keyboard_arrow_right
                    </mat-icon>
                    }
                    <mat-icon>
                        functions
                    </mat-icon>
                    {{
                        "builder.modeler.actions-mode.action-editor.function-editor.functions"
                            | translate
                    }}
                </button>
            </div>

            <div fxFlex="50" fxLayoutGap="3em" fxLayoutAlign="end center">
                <mat-menu #referencesMenu="matMenu">
                    @for (configuration of editorConfigurations; track
                    configuration) {
                    <nc-builder-action-editor-menu-item
                        [trigger]="referenceItemTrigger"
                        #referenceItem="menuInOtherComponent"
                        [configuration]="configuration"
                        [hidden]="!referencesOpened"
                    ></nc-builder-action-editor-menu-item>
                    <button
                        mat-menu-item
                        #referenceItemTrigger="matMenuTrigger"
                        [matMenuTriggerFor]="referenceItem.menu"
                    >
                        {{ configuration.title }}
                    </button>
                    }
                </mat-menu>
                <button
                    #matButton
                    fxFlexAlign="end center"
                    type="button"
                    mat-button
                    #referencesTrigger="matMenuTrigger"
                    [matMenuTriggerFor]="referencesMenu"
                >
                    <mat-icon>
                        link
                    </mat-icon>
                    {{
                        "builder.modeler.actions-mode.action-editor.function-editor.references"
                            | translate
                    }}
                    @if (referencesTrigger.menuOpen) {
                    <mat-icon>
                        keyboard_arrow_up
                    </mat-icon>
                    } @else {
                    <mat-icon>
                        keyboard_arrow_down
                    </mat-icon>
                    }
                </button>
            </div>
        </div>
        <div fxLayout="column" fxLayoutAlign="start stretch" id="_div'}}">
            <ngx-monaco-editor
                class="full-size-editor"
                id="_editor'}}"
                [options]="editorOptions"
                [formControl]="formControl"
                (onInit)="onInit($event)"
            ></ngx-monaco-editor>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
