<div>
    @for (action of leafNode.actions; track action; let i = $index) {
    <nc-builder-action-editor
        (actionChanged)="actionChangedListener($event)"
        (drawerOpened)="drawerChanged($event)"
        [action]="action"
        [index]="i"
        [leafNode]="leafNode"
        [name]="action.event + '_' + action.phase + '_' + i"
    ></nc-builder-action-editor>
    }
</div>
