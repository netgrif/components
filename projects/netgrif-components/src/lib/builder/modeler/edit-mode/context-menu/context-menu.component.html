<div class="menu" #menu>
    <div class="content">
        @for (item of menuItems; track item) {
        <button mat-menu-item class="menuItem" (click)="itemClick(item)">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.title }}</span>
        </button>
        }
    </div>
</div>
