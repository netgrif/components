<div id="modeler_area" fxFill fxLayout="column">
    <mat-toolbar>
        <nc-builder-control-panel></nc-builder-control-panel>
    </mat-toolbar>
    <mat-divider></mat-divider>
    <div fxFlex class="mode">
        @switch (controlPanelService.activeMode?.id) {
        @case ('simulation') { <nc-builder-simulation-mode></nc-builder-simulation-mode> }
        @case ('data') { <nc-builder-data-mode></nc-builder-data-mode> }
        @case ('roles') { <nc-builder-role-mode></nc-builder-role-mode> }
        @case ('actions') { <nc-builder-actions-mode></nc-builder-actions-mode> }
        @case ('i18n') { <nc-builder-i18n-mode></nc-builder-i18n-mode> }
        @case ('history') { <nc-builder-history-mode></nc-builder-history-mode> }
        @case ('task') { <nc-builder-task-mode></nc-builder-task-mode> }
        @default { <nc-builder-edit-mode></nc-builder-edit-mode> }
        }
    </div>
</div>
