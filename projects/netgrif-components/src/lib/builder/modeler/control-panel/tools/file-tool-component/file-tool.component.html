<button
    id="tool_{{ fileTool.id }}"
    mat-icon-button
    matTooltip="{{ fileTool.tooltip }}"
    [attr.aria-label]="fileTool.tooltip"
    (click)="(fileTool.onClick)"
>
    <input type="file" class="button--input" (change)="fileTool.onClick()" />
    <label>
        @if (fileTool.icon.isSvg) {
        <mat-icon svgIcon="{{ fileTool.icon.name }}"></mat-icon>
        } @if (!fileTool.icon.isSvg) {
        <mat-icon>{{ fileTool.icon.name }}</mat-icon>
        }
    </label>
</button>
