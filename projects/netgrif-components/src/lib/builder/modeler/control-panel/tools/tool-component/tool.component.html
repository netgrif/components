<button
    mat-icon-button
    id="tool_{{ tool.id }}"
    matTooltip="{{ tool.tooltip }}"
    [ngClass]="{ 'button-highlight': isActive() }"
    (click)="activate(); tool.onClick()"
    [disabled]="tool.disabled.value"
>
    @if (tool.icon.isSvg) {
    <mat-icon
        svgIcon="{{ tool.icon.name }}"
        [ngClass]="{
            'active-custom-svg': isActive(),
            'inactive-custom-svg': !isActive()
        }"
    ></mat-icon>
    } @else {
    <mat-icon
        [ngClass]="{
            'fill-svg': isActive(),
            'material-icons-outlined': isOutlined()
        }"
        >{{ tool.icon.name }}</mat-icon
    >
    }
</button>
