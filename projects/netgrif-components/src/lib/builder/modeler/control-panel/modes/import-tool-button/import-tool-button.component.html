<button
    mat-icon-button
    id="tool_{{ tool.id }}"
    matTooltip="{{ tool.tooltip }}"
    [attr.aria-label]="tool.tooltip"
    (click)="xmlFileInput.click()"
>

    <input
        #xmlFileInput
        type="file"
        accept=".xml, .bpmn"
        class="hidden-button"
        (change)="onClick($event)"
    />

    @if (tool.icon.isSvg) {
    <mat-icon svgIcon="{{ tool.icon.name }}"></mat-icon>
    } @if (!tool.icon.isSvg) {
    <mat-icon [ngClass]="{ 'material-icons-outlined': tool.icon.isOutlined }">{{
        tool.icon.name
    }}</mat-icon>
    }
</button>
