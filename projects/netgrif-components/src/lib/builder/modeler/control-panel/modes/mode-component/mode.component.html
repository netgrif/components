<button
    mat-icon-button
    id="mode_{{ mode.id }}"
    [ngClass]="{ 'button-highlight': isActive() }"
    matTooltip="{{ mode.tooltip }}"
    [attr.aria-label]="mode.tooltip"
    (click)="mode.onClick(); setActive()"
>

    @if (mode.icon.isSvg) {
    <mat-icon
        [ngClass]="{ 'fill-svg': isActive() }"
        svgIcon="{{ mode.icon.name }}"
    ></mat-icon>
    } @if (!mode.icon.isSvg) {
    <mat-icon
        [ngClass]="{
            'fill-svg': isActive(),
            'material-icons-outlined': isOutlined()
        }"
        >{{ mode.icon.name }}</mat-icon
    >
    }
</button>
