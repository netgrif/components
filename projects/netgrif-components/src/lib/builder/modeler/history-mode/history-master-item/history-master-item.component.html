<mat-list-item class="master-row" [class.item-selected]="selected === item" [class.item-actual]="isActual()" (click)="select()">
    @if (isActual()) {
    <mat-icon matListItemIcon class="actual-item-badge">beenhere</mat-icon>
    }
    <span matListItemTitle>{{ item.message }}</span>
    <span matListItemLine>{{ item.time.toLocaleTimeString() }}</span>
</mat-list-item>
