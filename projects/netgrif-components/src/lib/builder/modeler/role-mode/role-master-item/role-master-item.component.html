<mat-list-item class="master-row" [class.item-selected]="selected && selected.id === item.id" (click)="select()">
    <span matListItemTitle>{{ item.title.value || item.id }}</span>
    <span matListItemLine class="supporting">{{ item.id }}</span>
    <span matListItemMeta class="row-actions">
        @if (!_builderModeService.readOnly) {
        <button mat-icon-button [matTooltip]="'builder.modeler.role-mode.duplicateRole' | translate" (click)="onDuplicate($event, item)">
            <mat-icon>add_to_photos</mat-icon>
        </button>
        <button mat-icon-button [matTooltip]="'builder.modeler.role-mode.deleteRole' | translate" (click)="onDelete($event, item)">
            <mat-icon>delete</mat-icon>
        </button>
        }
    </span>
</mat-list-item>
