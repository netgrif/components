<div fxLayout="row" fxLayoutAlign="start center">
    @switch (getElementType()) {
    @case (taskElementEnum.DATA_GROUP_TITLE) {
    <div fxFlex class="group-title">
        <mat-divider></mat-divider>
        @if (getDataGroupTitle() !== '') {
        <span class="group-title-text" role="heading" aria-level="3">{{ getDataGroupTitle() }}</span>
        }
    </div>
    }
    @case (taskElementEnum.LOADER) {
    <mat-progress-bar fxFlex mode="indeterminate"></mat-progress-bar>
    }
    @case (taskElementEnum.BLANK) {
    <div></div>
    }
    @default {
    <div fxFlex>
        @if (!!getDataField()?.behavior && !getDataField().behavior.hidden) {
        <nc-data-field-template [_additionalFieldProperties]="{ taskId: getTaskId(), taskContentComponentClassReference }"
                                [dataField]="getDataField()"
                                [offset]="getFieldOffset()"></nc-data-field-template>
        }
    </div>
    }
    }
</div>
