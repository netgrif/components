@let selected = (selectedIds$ | async | contains: user.id);
<a mat-list-item [activated]="selected" [attr.aria-selected]="selected">
    <span matListItemAvatar class="avatar" aria-hidden="true">{{ initials }}</span>
    <span matListItemTitle>{{ user.fullName }}</span>
    <span matListItemLine>{{ user.email }}</span>
    <mat-checkbox matListItemMeta class="check" [checked]="selected" tabindex="-1" aria-hidden="true"></mat-checkbox>
</a>
