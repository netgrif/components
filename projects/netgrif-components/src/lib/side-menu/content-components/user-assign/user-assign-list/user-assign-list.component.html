@if (users$ | async; as users) {
@if (!loading && users.length === 0) {
<div fxLayout="column" fxLayoutAlign="center center" fxLayoutGap="8px">
    <mat-icon>person_add_disabled</mat-icon>
    <span class="mat-title-medium">{{ "side-menu.user.noUser" | translate }}</span>
</div>
}
<cdk-virtual-scroll-viewport itemSize="64" (scrolledIndexChange)="loadNextPage()">
    <mat-nav-list>
        <nc-user-assign-item *cdkVirtualFor="let user of users; trackBy: trackBy; templateCacheSize: 0"
            [user]="user"
            [selectedId$]="selectedUser$"
            (click)="select(user)"></nc-user-assign-item>
    </mat-nav-list>
    @if (loading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
</cdk-virtual-scroll-viewport>
}
