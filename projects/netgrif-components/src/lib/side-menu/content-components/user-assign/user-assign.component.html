<mat-toolbar>{{ "side-menu.user.assign" | translate }}</mat-toolbar>
<div class="content" fxLayout="column">
    <mat-form-field>
        <mat-icon matIconPrefix>search</mat-icon>
        <input matInput placeholder="{{ 'side-menu.user.choose' | translate }}" [formControl]="searchUserControl"/>
        @if (searchUserControl.value) {
        <button mat-icon-button matIconSuffix (click)="searchUserControl.setValue('')">
            <mat-icon>close</mat-icon>
        </button>
        }
    </mat-form-field>
    <nc-user-assign-list fxFlex [searchUserControl]="searchUserControl" [roles]="roles" [negativeRoles]="negativeRoles" [initiallySelectedUser]="initiallySelectedUser" (userSelected)="userWasSelected($event)"></nc-user-assign-list>
<div fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px">
    <button mat-flat-button (click)="assign()">{{ "tasks.view.assign" | translate }}</button>
</div>
</div>
