<mat-toolbar>{{ 'side-menu.impersonation.title' | translate }}</mat-toolbar>
<div class="content" fxLayout="column">
    <nc-header #header [type]="headerType" [maxHeaderColumns]="3" [responsiveHeaders]="true" [hideHeaderMenu]="true" [ngStyle]="{ width: getWidth() }"></nc-header>
    <nc-case-list fxFlex
                  [selectedHeaders$]="selectedHeaders$"
                  [showDeleteMenu]="false"
                  [width]="getWidth()"
                  [responsiveBody]="true"
                  [textEllipsis]="true"
                  (caseClick)="handleCaseClick($event)"></nc-case-list>
</div>
