<mat-card appearance="outlined" fxFlexFill>
    <ngx-charts-pie-chart fxFlexFill class="dashboard-pie-chart"
                          [scheme]="colorScheme"
                          [results]="single"
                          [gradient]="gradient"
                          [legend]="showLegend"
                          [legendPosition]="legendPosition"
                          [labels]="showLabels"
                          [doughnut]="isDoughnut"
                          [legendTitle]="card.title"
                          (select)="onSelect($event)">
    </ngx-charts-pie-chart>
</mat-card>
