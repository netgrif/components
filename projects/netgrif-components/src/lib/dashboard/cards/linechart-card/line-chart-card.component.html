<mat-card appearance="outlined" fxFlexFill>
    <ngx-charts-line-chart fxFlexFill class="dashboard-line-chart"
                           [legend]="showLegend"
                           [showXAxisLabel]="showXAxisLabel"
                           [showYAxisLabel]="showYAxisLabel"
                           [xAxis]="xAxis"
                           [yAxis]="yAxis"
                           [xAxisLabel]="card.xAxisLabel"
                           [yAxisLabel]="card.yAxisLabel"
                           [timeline]="timeline"
                           [results]="multi"
                           [legendTitle]="card.title"
                           (select)="onSelect($event)">
    </ngx-charts-line-chart>
</mat-card>
