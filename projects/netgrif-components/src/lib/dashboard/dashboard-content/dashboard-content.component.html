<mat-grid-list [cols]="params.columns" rowHeight="210px" gutterSize="16px">
    @for (card of gridElements; track card) {
    <mat-grid-tile [colspan]="card.layout.cols" [rowspan]="card.layout.rows">
        @switch (card.type) { @case (cardTypes.COUNT) {
        <nc-count-card [card]="card.item" fxFlexFill></nc-count-card>
        } @case (cardTypes.IFRAME) {
        <nc-iframe-card [card]="card.item" fxFlexFill></nc-iframe-card>
        } @case (cardTypes.PIE) {
        <nc-pie-chart-card
            [card]="card.item"
            fxFlexFill
        ></nc-pie-chart-card>
        } @case (cardTypes.LINE) {
        <nc-line-chart-card
            [card]="card.item"
            fxFlexFill
        ></nc-line-chart-card>
        } @case (cardTypes.LINEARGAUGE) {
        <nc-linear-gauge-card
            [card]="card.item"
            fxFlexFill
        ></nc-linear-gauge-card>
        } @case (cardTypes.BAR) {
        <nc-barchart-card
            [card]="card.item"
            fxFlexFill
        ></nc-barchart-card>
        } @case (cardTypes.DEFAULT) {
        <nc-portal-card
            [card]="card.item"
            [componentPortal]="card.item.portalComponent"
            fxFlexFill
        ></nc-portal-card>
        } @case (cardTypes.BLANK) {
        <div></div>
        } }
    </mat-grid-tile>
    }
</mat-grid-list>
