<nc-app-panel [panelHeader]="header" [preventExpand]="true">
    <ng-template #header>
        <div fxLayoutAlign="start center" fxLayout="row" fxFlex fxLayoutGap="16px">
            @for (field of featuredFieldsValues; track $index; let i = $index) {
            <div
                class="workflow-panel-item"
                fxFlex
                [fxHide.lt-xl]="i >= 4 && responsiveBody && !overflowMode"
                [fxHide.lt-lg]="i >= 3 && responsiveBody && !overflowMode"
                [fxHide.lt-md]="i >= 2 && responsiveBody && !overflowMode"
                [fxHide.lt-sm]="i >= 1 && responsiveBody && !overflowMode"
            >
                @if (!!field.icon && !!field.value) {
                <mat-icon class="workflow-panel-icon panel-primary-icon">{{ field.icon }}</mat-icon>
                }
                <span class="workflow-panel-text" [title]="field.value ?? ''">{{ field.value }}</span>
            </div>
            }
        </div>
        <div fxFlex="40px"></div>
    </ng-template>
</nc-app-panel>
