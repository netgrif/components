<mat-expansion-panel #matExpansionPanel
                     hideToggle
                     [class.nc-expansion-no-animation]="expansionDisabled"
                     [disabled]="preventCollapse"
                     (afterExpand)="emitExpand()"
                     (afterCollapse)="emitCollapse()">
    @if (showPanelHeader()) {
    <mat-expansion-panel-header (click)="expandPanel()" [ngStyle]="caseColor?.startsWith('#') ? { background: caseColor, color: getCaseFontColor() } : null">
        <mat-panel-description *ngTemplateOutlet="panelHeader"></mat-panel-description>
    </mat-expansion-panel-header>
    }
    <ng-template matExpansionPanelContent>
        <ng-container *ngTemplateOutlet="panelContent"></ng-container>
    </ng-template>
</mat-expansion-panel>
@if (!last) {
<mat-divider></mat-divider>
}
