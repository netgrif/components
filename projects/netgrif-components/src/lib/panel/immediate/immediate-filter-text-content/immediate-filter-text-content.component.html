<div
    [matTooltip]="ellipsis ? tooltip : null"
    [ngClass]="{ ellipsis: ellipsis }"
    fxFlex
>
    @for (segment of segments; track segment) {
    <span [ngClass]="{ 'bold-text': segment.bold }" class="span-margin">
        {{
            segment.uppercase
                ? (segment.segment | translate | uppercase)
                : (segment.segment | translate)
        }}
    </span>
    }
</div>
