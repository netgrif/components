<nc-app-panel [panelHeader]="casePanelHeader"
              [preventExpand]="true"
              [first]="first"
              [last]="last"
              [caseColor]="case_.color">
    <ng-template #casePanelHeader>
        <div fxFlex fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="16px" (click)="preventSelectionClick($event)"
             [style.--nc-column-min-width]="getMinWidth()">
            @if (approval && typeApproval() === 'multichoice') {
            <mat-checkbox [formControl]="approvalFormControl" (click)="$event.stopPropagation()"></mat-checkbox>
            }
            @if (approval && typeApproval() === 'enumeration') {
            <mat-radio-group [formControl]="approvalFormControl" (click)="$event.stopPropagation()">
                <mat-radio-button [value]="caseValue()"></mat-radio-button>
            </mat-radio-group>
            }
            @for (field of featuredFieldsValues; track $index; let i = $index) {
            <nc-panel-item fxFlex
                           [fxHide.lt-xl]="i >= 4 && responsiveBody && !overflowMode"
                           [fxHide.lt-lg]="i >= 3 && responsiveBody && !overflowMode"
                           [fxHide.lt-md]="i >= 2 && responsiveBody && !overflowMode"
                           [fxHide.lt-sm]="i >= 1 && responsiveBody && !overflowMode"
                           [leadingIcon]="case_.icon"
                           [leadingIconEnabled]="i === 0"
                           [featuredValue]="field"
                           [textEllipsis]="textEllipsis"></nc-panel-item>
            }
        </div>
        <div fxFlex="40px" fxLayoutAlign="center center">
        @if (showDeleteMenu && canDelete()) {
        <button mat-icon-button (click)="show($event)" [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="deleteCase()">
                <mat-icon>delete</mat-icon>
                <span>{{ "panel.case.delete" | translate }}</span>
            </button>
        </mat-menu>
        }
        </div>
    </ng-template>
</nc-app-panel>
