<mat-form-field appearance="outline"
    fxFlexFill
>
    @if (!showLargeLayout.value && hasTitle()) {
    <mat-label>{{ dataField.title }}</mat-label>
    }
    <input
        matInput
        [matDatepicker]="datepicker"
        [required]="dataField.behavior.required"
        [placeholder]="dataField.placeholder"
        [formControl]="formControlRef"
        (click)="datepicker.open()"
        [min]="dataField.min"
        [max]="dataField.max"
        (keydown.enter)="datepicker.close()"
    />
    <mat-datepicker-toggle matPrefix [for]="datepicker"></mat-datepicker-toggle>
    <mat-datepicker #datepicker></mat-datepicker>
    <mat-hint>{{
        dataField.description
    }}</mat-hint>
    @if (dataField.isInvalid(formControlRef)) {
    <mat-error>{{ getErrorMessage() }}</mat-error>
    }
</mat-form-field>
