<h2 mat-dialog-title>{{ isPdf() ? "PDF" : "Image" }}: {{ data.dataField.value.name }}</h2>
<mat-dialog-content fxLayout="row" fxLayoutAlign="center center">
    @if (!fullImageExists()) {
    <img [src]="data.imagePreview" alt="Image preview"/>
    } @else if (!isPdf()) {
    <img [src]="image" alt="Image"/>
    } @else {
    <embed [src]="image" type="application/pdf"/>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="true">{{ "dialog.close" | translate }}</button>
</mat-dialog-actions>
