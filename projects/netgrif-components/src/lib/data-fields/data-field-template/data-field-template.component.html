<div #dataFieldContainer>
    @if (evaluateTemplateCondition()) {
    <div fxLayout="row" fxLayoutAlign="start center">
        <div fxFlex="{{ offset }}"></div>
        <span fxFlex="{{ 47.5 - offset }}" class="mat-body-large" [matTooltip]="dataField.description">
            {{ dataField.title }}
            @if (dataField.behavior.required) {
            <nc-required-label [isIn]="true"></nc-required-label>
            }
        </span>
        <div fxFlex="5"></div>
        <div fxFlex="{{ 47.5 - offset }}">
            <ng-container [cdkPortalOutlet]="componentPortal"></ng-container>
        </div>
        <div fxFlex="{{ offset }}"></div>
    </div>
    } @else {
    <div fxLayout="row">
        <div fxFlex="{{ offset }}"></div>
        <div fxFlex="{{ 100 - 2 * offset }}">
            <ng-container [cdkPortalOutlet]="componentPortal"></ng-container>
        </div>
        <div fxFlex="{{ offset }}"></div>
    </div>
    }
</div>
