@if (!tile.isEmpty) {
<ng-template [cdkPortalOutlet]="portal"></ng-template>
} @else {
<div
    class="fill-available-space"
    fxLayout="row"
    fxLayoutAlign="center center"
>
    @if (!fc.disabled) {
    <button mat-icon-button (click)="createNewDashboardTile()">
        <mat-icon>add</mat-icon>
    </button>
    }
</div>
}
