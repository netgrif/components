<div
    fxFlexFill
    [gdColumns]="getGridColumns()"
    [gdRows]="getGridRows()"
>
    @for (tile of dashboardTiles; track tile) {
    <nc-task-ref-dashboard-tile
        [tile]="tile"
        [taskRef]="dataField"
        [fc]="formControlRef"
        [gdColumn]="getTileGridColumn(tile)"
        [gdRow]="getTileGridRow(tile)"
        [taskContentComponentClassReference]="
            taskContentComponentClassReference
        "
    ></nc-task-ref-dashboard-tile>
    }
</div>
