<mat-form-field appearance="outline" class="user-field">
    @if (hasTitle()) {
    <mat-label>{{ dataField.title }}</mat-label>
    }
    @if (dataField.value) {
    <span matIconPrefix class="avatar" aria-hidden="true">{{ initials(dataField.value) }}</span>
    }
    <input matInput readonly
           [value]="dataField.value?.fullName ?? ''"
           [placeholder]="dataField.placeholder || ('dataField.user.selectUser' | translate)"
           [required]="dataField.behavior.required"
           [disabled]="formControlRef.disabled"
           [errorStateMatcher]="dataFieldErrorStateMatcher"
           [matTooltip]="dataField.value?.email ?? ''"
           matTooltipShowDelay="600"
           (click)="!dataField.value && selectUser()"/>
    @if (!formControlRef.disabled && dataField.value) {
    <button mat-icon-button matIconSuffix type="button" (click)="deleteUser()" [matTooltip]="'dataField.user.deleteUser' | translate">
        <mat-icon>close</mat-icon>
    </button>
    }
    @if (!formControlRef.disabled && !dataField.value) {
    <button mat-icon-button matIconSuffix type="button" (click)="selectUser()" [matTooltip]="'dataField.user.selectUser' | translate">
        <mat-icon>person_add</mat-icon>
    </button>
    }
    <mat-hint>{{ dataField.description }}</mat-hint>
    <mat-error>{{ "dataField.validations.required" | translate }}</mat-error>
</mat-form-field>
