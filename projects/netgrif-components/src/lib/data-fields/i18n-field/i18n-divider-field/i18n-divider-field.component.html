<div class="divider-field">
    <mat-divider [class.lgbtq]="isDividerLGBTQ()"
                 [ngStyle]="checkPropertyInComponent('dividerColor') && { 'border-top-color': getDividerColor() }"></mat-divider>
    @if (!!dataField.value?.defaultValue) {
    <span class="divider-text" role="heading" aria-level="3"
          [ngStyle]="checkPropertyInComponent('fontSize') && { 'font-size': getDividerFontSize() }">{{ dataField.value.defaultValue }}</span>
    }
</div>
