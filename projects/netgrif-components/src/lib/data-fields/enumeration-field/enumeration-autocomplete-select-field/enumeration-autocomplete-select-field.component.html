<mat-form-field appearance="outline"
    fxFlexFill
>
    @if (!showLargeLayout.value && hasTitle()) {
    <mat-label>{{ dataField.title }}</mat-label>
    }
    <input
        type="text"
        aria-label="Autocomplete"
        matInput
        #input
        [placeholder]="dataField.placeholder"
        [formControl]="formControlRef"
        [matAutocomplete]="auto"
        [required]="dataField.behavior.required"
        (focus)="change()"
        (keyup)="change()"
    />
    <mat-autocomplete
        [displayWith]="renderSelection"
        autoActiveFirstOption
        #auto="matAutocomplete"
    >
        <mat-option [value]="null">---</mat-option>
        @for (option of filteredOptions | async; track option) {
        <mat-option [value]="option.key" (click)="change()">
            {{ option.value }}
        </mat-option>
        }
    </mat-autocomplete>
    <mat-hint>{{
        dataField.description
    }}</mat-hint>
    @if (dataField.isInvalid(formControlRef)) {
    <mat-error>{{ buildErrorMessage() }}</mat-error>
    }
</mat-form-field>
