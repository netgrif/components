<mat-form-field appearance="outline"
    fxFlexFill
>
    @if (!showLargeLayout.value && hasTitle()) {
    <mat-label>{{ dataField.title }}</mat-label>
    }
    <mat-select
        [formControl]="formControlRef"
        [placeholder]="dataField.placeholder"
        [required]="dataField.behavior.required"
    >
        <mat-option [value]="null">---</mat-option>
        @for (option of dataField.choices; track option) {
        <mat-option [value]="option.key">
            {{ option.value }}
        </mat-option>
        }
    </mat-select>
    <mat-hint>{{
        dataField.description
    }}</mat-hint>
    @if (dataField.isInvalid(formControlRef)) {
    <mat-error>{{ "dataField.validations.required" | translate }}</mat-error>
    }
</mat-form-field>
