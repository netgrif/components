<div fxLayout="row" fxLayoutGap="8px">
    <mat-form-field appearance="outline" fxFlex>
        @if (!showLargeLayout.value && hasTitle()) {
        <mat-label>{{ dataField.title }}</mat-label>
        }
        <input
            matInput
            [matDatepicker]="picker"
            [required]="dataField.behavior.required"
            [placeholder]="dataField.placeholder"
            [formControl]="dateControl"
            [errorStateMatcher]="dataFieldErrorStateMatcher"
            [min]="dataField.min"
            [max]="dataField.max"
            (dateChange)="dateChanged($event.value)"
            (blur)="formControlRef.markAsTouched()"
            (click)="picker.open()"
            (keydown.enter)="picker.close()"
        />
        <mat-datepicker-toggle matIconPrefix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-hint>{{ dataField.description }}</mat-hint>
        @if (dataField.isInvalid(formControlRef)) {
        <mat-error>{{ getErrorMessage() }}</mat-error>
        }
    </mat-form-field>
    <mat-form-field appearance="outline" fxFlex="140px">
        <input
            matInput
            [matTimepicker]="timepicker"
            [matTimepickerMin]="timeMin"
            [matTimepickerMax]="timeMax"
            [required]="dataField.behavior.required"
            [formControl]="formControlRef"
        />
        <mat-timepicker-toggle matIconSuffix [for]="timepicker"></mat-timepicker-toggle>
        <mat-timepicker #timepicker interval="5m"></mat-timepicker>
    </mat-form-field>
</div>
