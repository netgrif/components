@if (!showLargeLayout.value && hasTitle()) {
<span class="field-title">
    {{ dataField.title }}
    @if (dataField.behavior.required) {
    <nc-required-label [isIn]="!formControlRef.disabled"></nc-required-label>
    }
</span>
}
<div #canvasDiv class="pad" [class.disabled]="formControlRef.disabled" (blur)="mouseUp($event)">
    <canvas #signPad
            width="{{ canvasWidth }}"
            height="{{ canvasHeight }}"
            (mousedown)="onMouseDown($event)"
            (mousemove)="onMouseMove($event)"
            (touchmove)="onMouseMove($event)"
            (touchstart)="onMouseDown($event)"
            (blur)="mouseUp($event)"></canvas>
</div>
@if (dataField.isInvalid(formControlRef)) {
<span class="field-supporting indented error">{{ getErrorMessage() }}</span>
} @else if (hasHint()) {
<span class="field-supporting indented">{{ dataField.description }}</span>
}
@if (!formControlRef.disabled) {
<div class="actions">
    <button mat-button type="button" (click)="clearSignature()">{{ "dataField.clear" | translate }}</button>
    <button mat-flat-button type="button" (click)="saveSignature()">{{ "dataField.save" | translate }}</button>
</div>
}
