@if (!formControlRef.disabled && dataField.behavior.editable) {
<nc-simple-text-field
    [dataField]="dataField"
    [formControlRef]="formControlRef"
    [showLargeLayout]="showLargeLayout"
></nc-simple-text-field>
} @else { @if (initialized) {
<nc-iframe-card [card]="card" fxFlexFill></nc-iframe-card>
} }
