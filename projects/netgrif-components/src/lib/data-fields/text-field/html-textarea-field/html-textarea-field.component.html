<div #quillContainer>
    @if (!formControlRef.disabled) {
    <quill-editor theme="snow"
                  [ngModel]="dataField.value"
                  (ngModelChange)="setQuillValue($event)"
                  [modules]="quillModules"
                  [valueGetter]="quillValueGetter"
                  [bounds]="quillContainer"
                  placeholder="{{ dataField.placeholder | translate }}"></quill-editor>
    } @else {
    <div class="ql-snow outlined">
        <div class="ql-editor" [innerHTML]="disabledDisplay"></div>
    </div>
    }
    @if (dataField.isInvalid(formControlRef)) {
    <span class="field-supporting indented error">{{ getErrorMessage() }}</span>
    } @else if (hasHint()) {
    <span class="field-supporting indented">{{ dataField.description }}</span>
    }
    <input type="hidden" [formControl]="formControlRef"/>
</div>
