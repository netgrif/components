<mat-form-field appearance="outline"
    fxFlexFill
>
    @if (!showLargeLayout.value && hasTitle()) {
    <mat-label>{{ dataField.title }}</mat-label>
    }
    <mat-chip-grid
        #chipList
        aria-label="Autocomplete"
        [formControl]="formControlRef"
    >
        @for (option of dataField.value; track $index) {
        <mat-chip-row (removed)="remove(option)">
            {{ option }}
            @if (!formControlRef.disabled) {
            <button matChipRemove>
                <mat-icon>cancel</mat-icon>
            </button>
            }
        </mat-chip-row>
        }
        <input
            aria-label="Autocomplete"
            matInput
            #input
            [placeholder]="dataField.placeholder"
            [required]="dataField.behavior.required"
            [matChipInputFor]="chipList"
            (matChipInputTokenEnd)="add($event)"
            (blur)="add($event)"
            [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
        />
    </mat-chip-grid>
    <mat-hint>{{
        dataField.description
    }}</mat-hint>
    @if (dataField.isInvalid(formControlRef)) {
    <mat-error>{{ "dataField.validations.required" | translate }}</mat-error>
    }
</mat-form-field>
