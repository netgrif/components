<mat-slide-toggle [formControl]="formControlRef">
    @if (!showLargeLayout.value && hasTitle()) {
    {{ dataField.title }}
    @if (dataField.behavior.required) {
    <nc-required-label [isIn]="!formControlRef.disabled"></nc-required-label>
    }
    }
</mat-slide-toggle>
@if (dataField.isInvalid(formControlRef)) {
<span class="field-supporting error">{{ getErrorMessage() }}</span>
} @else if (hasHint()) {
<span class="field-supporting">{{ dataField.description }}</span>
}
