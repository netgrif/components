<form class="auth-form" [formGroup]="rootFormGroup" (ngSubmit)="onSubmit()" novalidate>
    <mat-form-field>
        <mat-label>{{ "forms.email.enterEmail" | translate }}</mat-label>
        <input matInput type="email" formControlName="email" required autocomplete="email" autofocus/>
        @if (rootFormGroup.controls['email'].hasError('email')) {
        <mat-error>{{ "dataField.validations.email" | translate }}</mat-error>
        }
    </mat-form-field>
    @if (displayLegalNotice) {
    <nc-legal-notice [buttonName]="'forms.email.send'"></nc-legal-notice>
    }
    <button mat-flat-button class="auth-submit" type="submit" [disabled]="loading | async">
        {{ "forms.email.send" | translate }}
    </button>
    @if (loading | async) {
    <mat-progress-bar class="auth-progress" mode="indeterminate"></mat-progress-bar>
    }
    <div class="auth-footer">
        <button mat-button type="button" (click)="emitGoBack()">
            <mat-icon>arrow_back</mat-icon>
            {{ "forms.email.backToLogin" | translate }}
        </button>
    </div>
</form>
