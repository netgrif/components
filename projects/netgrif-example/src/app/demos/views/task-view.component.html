<div class="view">
    @if (enableSearch) {
    <div class="search-row"><nc-search class="search"></nc-search></div>
    }
    <!-- header and rows scroll together, the paginator stays below them -->
    <nc-task-list-pagination class="list"
                             [tasks$]="tasks$"
                             [loading$]="loading$"
                             [allowMultiOpen]="allowMultiOpen"
                             [selectedHeaders$]="selectedHeaders$"
                             [responsiveBody]="true"
                             [textEllipsis]="true">
        <nc-header #header ncListHeader type="task" [responsiveHeaders]="true"></nc-header>
    </nc-task-list-pagination>
</div>
