<nc-authentication-overlay>
    <!-- Material 3 login page (the same layout as the Keycloak login theme of Netgrif): brand pane on large screens,
         top bar with the language, the form in a card -->
    <div class="login-page">
        <aside class="hero" aria-hidden="true">
            <img class="hero-logo" src="assets/netgrif_logo_white.svg" alt="">
        </aside>
        <main class="login-main">
            <div class="topbar">
                <img class="topbar-logo" src="assets/netgrif_logo.svg" alt="Netgrif">
                <button mat-button class="language" [matMenuTriggerFor]="languageMenu" [attr.aria-label]="'toolbar.menu.lang' | translate">
                    <mat-icon>translate</mat-icon>
                    {{ currentLanguage() | uppercase }}
                    <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
                </button>
                <mat-menu #languageMenu="matMenu" xPosition="before">
                    @for (lang of languages(); track lang) {
                    <button mat-menu-item (click)="setLanguage(lang)">
                        <mat-icon>{{ lang === currentLanguage() ? 'check' : '' }}</mat-icon>
                        <span>{{ "toolbar.menu." + lang | translate }}</span>
                    </button>
                    }
                </mat-menu>
            </div>
            <section class="login-card">
                <h1 class="headline">{{ title | translate }}</h1>
                <p class="subtitle">{{ subtitle | translate }}</p>
                @switch (page) {
                @case ('login') {
                <nc-login-form [showSignUpButton]="true" [showForgottenPasswordButton]="true"
                               (login)="onLogin($event)"
                               (signUp)="navigate('sign-up')"
                               (resetPassword)="navigate('forgotten-password')"></nc-login-form>
                }
                @case ('registration') {
                <nc-registration-form [token]="token" [displayLegalNotice]="false" (register)="onPasswordSet($event)"></nc-registration-form>
                }
                @case ('recovery') {
                <nc-forgotten-password-form [token]="token" (register)="onPasswordSet($event)"></nc-forgotten-password-form>
                }
                @default {
                @if (mailSent) {
                <p class="mail-sent" role="status">
                    <mat-icon>mail</mat-icon>
                    <span>{{ "forms.email.sent" | translate }}</span>
                </p>
                <div class="sent-footer">
                    <button mat-button type="button" (click)="toLogin()">
                        <mat-icon>arrow_back</mat-icon>
                        {{ "forms.email.backToLogin" | translate }}
                    </button>
                </div>
                } @else {
                <nc-email-submission-form [displayLegalNotice]="false" (formSubmit)="onEmailSubmit($event)"
                                          (goBackButton)="toLogin()"></nc-email-submission-form>
                }
                }
                }
            </section>
        </main>
    </div>
</nc-authentication-overlay>
